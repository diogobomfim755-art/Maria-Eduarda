<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eu dedico essa pra você! 💙</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:auto;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eaf8ff,#cfeeff 50%,#e3f6ff);display:flex;align-items:center;justify-content:center;color:#286080;padding:18px 0}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
.heart{position:absolute;color:#65bce6;font-size:50px;opacity:.85;filter:drop-shadow(0 5px 12px rgba(56,151,194,.2))}
.h1{top:4%;left:3%;transform:rotate(-15deg)}.h2{top:8%;right:4%;font-size:70px;transform:rotate(16deg)}.h3{bottom:7%;left:5%;font-size:62px;transform:rotate(12deg)}.h4{bottom:4%;right:4%;transform:rotate(-18deg)}.h5{top:48%;left:1%;font-size:32px}.h6{top:39%;right:1%;font-size:38px}
.card{width:min(92vw,560px);background:rgba(255,255,255,.75);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:26px 22px 30px;box-shadow:0 22px 60px rgba(55,135,170,.22);text-align:center;position:relative;z-index:2}
h1{margin:0 0 18px;font-size:clamp(27px,6vw,39px);color:#397fa3;font-weight:700}
.video-container{width:100%;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#d9f2ff;box-shadow:0 12px 32px rgba(40,128,170,.18);position:relative}
video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.start-screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:rgba(207,238,255,.22);cursor:pointer}
.start-screen.hidden{display:none}
.play-button{width:105px;height:105px;border:0;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(44,125,165,.25);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.spiderman{width:48px;height:56px;border-radius:48% 48% 42% 42%;background:linear-gradient(#d83b4b 0%,#d83b4b 54%,#245a9b 55%);position:relative;box-shadow:inset 0 0 0 2px #183f71}
.spiderman:before,.spiderman:after{content:"";position:absolute;top:16px;width:12px;height:7px;background:#fff;border:2px solid #183f71;border-radius:70% 30%}
.spiderman:before{left:7px;transform:rotate(20deg)}.spiderman:after{right:7px;transform:rotate(-20deg)}
.web{position:absolute;width:48px;height:48px;border-radius:50%;opacity:.28;background:repeating-radial-gradient(circle,#fff 0 1px,transparent 2px 9px)}
.play-text{font-weight:700;color:#397fa3;text-shadow:0 1px 4px #fff}
.fullscreen-btn{position:absolute;right:12px;bottom:12px;z-index:5;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#397fa3;font-size:25px;cursor:pointer;box-shadow:0 5px 15px rgba(40,128,170,.2)}
.tiktok-button{display:inline-block;margin-top:18px;padding:13px 22px;border-radius:999px;background:#74c5ea;color:#fff;text-decoration:none;font-weight:700;box-shadow:0 8px 18px rgba(58,151,193,.22)}
.description{font-size:12px;margin-top:12px;color:#79a6b9}
@media(max-width:600px){.card{padding:22px 16px 26px}.video-container{border-radius:22px}}
</style>
</head>
<body>
<div class="hearts">
<div class="heart h1">♥</div><div class="heart h2">♥</div><div class="heart h3">♥</div><div class="heart h4">♥</div><div class="heart h5">♥</div><div class="heart h6">♥</div>
</div>
<main class="card">
<h1>Eu dedico essa pra você! 💙</h1>
<div class="video-container" id="videoContainer">
<video id="video" src="video.mp4" playsinline preload="metadata"></video>
<button class="fullscreen-btn" id="fullscreenBtn" aria-label="Tela cheia">⛶</button>
<div class="start-screen" id="startScreen">
<button class="play-button" aria-label="Começar vídeo"><span class="web"></span><span class="spiderman"></span></button>
<div class="play-text">Começar o vídeo</div>
</div>
</div>
<a class="tiktok-button" href="https://vt.tiktok.com/ZSq3fnXV4/" target="_blank" rel="noopener">Ver no TikTok 💙</a>
<div class="description">Um pedacinho especial feito para você.</div>
</main>
<script>
const video=document.getElementById("video");
const start=document.getElementById("startScreen");
const fs=document.getElementById("fullscreenBtn");
const box=document.getElementById("videoContainer");

start.addEventListener("click",async()=>{start.classList.add("hidden");try{await video.play()}catch(e){start.classList.remove("hidden")}});
video.addEventListener("ended",()=>start.classList.remove("hidden"));
fs.addEventListener("click",async()=>{
 try{
   if(document.fullscreenElement){await document.exitFullscreen();}
   else if(box.requestFullscreen){await box.requestFullscreen();}
 }catch(e){}
});
</script>
</body>
</html>
