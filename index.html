<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um pedacinho de nós 💙</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow:hidden;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:linear-gradient(145deg,#eaf8ff,#cfeeff 48%,#e3f6ff);
    color:#286080; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .hearts{position:fixed;inset:0;pointer-events:none;z-index:0}
  .heart{
    position:absolute; font-size:clamp(28px,5vw,55px);
    color:#78c8ee; opacity:.8;
    filter:drop-shadow(0 4px 10px rgba(56,151,194,.18));
  }
  .h1{top:4%;left:3%;transform:rotate(-15deg)}
  .h2{top:9%;right:4%;font-size:70px;transform:rotate(16deg)}
  .h3{bottom:7%;left:5%;font-size:62px;transform:rotate(12deg)}
  .h4{bottom:4%;right:4%;transform:rotate(-18deg)}
  .h5{top:48%;left:1%;font-size:32px}
  .h6{top:39%;right:1%;font-size:38px}
  .card{
    width:min(92vw,560px); max-height:92vh; overflow:auto;
    background:rgba(255,255,255,.72); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:32px; padding:26px 22px 30px;
    box-shadow:0 22px 60px rgba(55,135,170,.22);
    text-align:center; position:relative; z-index:2;
  }
  h1{margin:0 0 7px;font-size:clamp(25px,6vw,38px);color:#397fa3}
  p{margin:0 0 18px;color:#5c91aa}
  .video-wrap{
    width:100%; aspect-ratio:9/16; max-height:62vh;
    border-radius:24px; overflow:hidden; background:#d9f2ff;
    box-shadow:0 12px 32px rgba(40,128,170,.18);
    position:relative;
  }
  .video-wrap blockquote{margin:0!important}
  .fallback{
    position:absolute; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:center; gap:15px;
    padding:25px; background:linear-gradient(160deg,#eaf8ff,#c9ebfa);
  }
  .play{
    width:105px;height:105px;border:0;border-radius:50%;
    background:#fff; box-shadow:0 10px 30px rgba(44,125,165,.22);
    cursor:pointer; position:relative; display:grid;place-items:center;
  }
  .spidey{
    width:48px;height:56px;border-radius:48% 48% 42% 42%;
    background:linear-gradient(#d83b4b 0 54%,#245a9b 55%);
    position:relative; box-shadow:inset 0 0 0 2px #183f71;
  }
  .spidey:before,.spidey:after{
    content:"";position:absolute;top:16px;width:12px;height:7px;
    background:#fff;border:2px solid #183f71;border-radius:70% 30%;
  }
  .spidey:before{left:7px;transform:rotate(20deg)}
  .spidey:after{right:7px;transform:rotate(-20deg)}
  .web{position:absolute;inset:0;border-radius:50%;opacity:.28;
    background:repeating-radial-gradient(circle,#fff 0 1px,transparent 2px 9px)}
  .play .web{width:48px;height:48px}
  .play-label{font-weight:700;color:#397fa3}
  .open{
    display:inline-block;margin-top:18px;padding:13px 22px;border-radius:999px;
    background:#74c5ea;color:white;text-decoration:none;font-weight:700;
    box-shadow:0 8px 18px rgba(58,151,193,.22)
  }
  .small{font-size:12px;margin-top:12px;color:#79a6b9}
</style>
</head>
<body>
<div class="hearts">
  <div class="heart h1">♥</div><div class="heart h2">♥</div>
  <div class="heart h3">♥</div><div class="heart h4">♥</div>
  <div class="heart h5">♥</div><div class="heart h6">♥</div>
</div>

<main class="card">
  <h1>Um pedacinho de nós 💙</h1>
  <p>Tem coisas que merecem ser guardadas para sempre.</p>

  <div class="video-wrap">
    <div class="fallback" id="fallback">
      <button class="play" onclick="abrirVideo()" aria-label="Começar vídeo">
        <span class="web"></span><span class="spidey"></span>
      </button>
      <div class="play-label">Começar o vídeo</div>
    </div>
  </div>

  <a class="open" href="https://vt.tiktok.com/ZSq3fnXV4/" target="_blank" rel="noopener">
    Assistir no TikTok 💙
  </a>
  <div class="small">Toque no botão com o Homem-Aranha para começar.</div>
</main>

<script>
function abrirVideo(){
  window.open("https://vt.tiktok.com/ZSq3fnXV4/","_blank","noopener");
}
</script>
</body>
</html>
